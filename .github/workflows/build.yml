name: Bygg manifest og SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Importer rapporter
        run: python tools/import_reports.py
      - name: Valider og bygg
        run: python tools/build.py
      - name: Commit endringer
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Automatisk bygg: manifest, sitemap og SEO"
            git push
          fi
