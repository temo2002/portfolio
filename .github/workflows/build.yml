name: Bygg manifest og SEO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer LaTeX for CV-en
        run: |
          if ! git diff --quiet HEAD~1 HEAD -- cv/main.tex 2>/dev/null || [ ! -f cv/Temmam_Altaie_CV.pdf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended lmodern
          fi
      - name: Bygg CV
        run: python tools/build_cv.py
      - name: Bygg forsidene (norsk og engelsk)
        run: python tools/build_pages.py
      - name: Importer rapporter
        run: python tools/import_reports.py
      - name: Valider og bygg
        run: python tools/build.py
      - name: Commit endringer
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Automatisk bygg: manifest, sitemap og SEO"
            git push
          fi
